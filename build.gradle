plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group
def targetJavaVersion = Integer.parseInt(project.java_version as String)

base {
	archivesName = 'travellers-handbook'
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		'travellers-handbook' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets.main.java.exclude '**/loaders/neoforge/**'
sourceSets.client.java.exclude '**/loaders/neoforge/**'

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "maven.modrinth:midnightlib:${project.midnightlib_version}"
	include "maven.modrinth:midnightlib:${project.midnightlib_version}"
}

processResources {
	def modVersion = project.version
	def minecraftVersion = project.minecraft_version
	def fabricLoaderMinVersion = project.fabric_loader_min_version
	def javaVersion = project.java_version
	def midnightLibMinVersion = project.midnightlib_min_version
	inputs.properties 'version': modVersion, 'minecraft_version': minecraftVersion,
			'fabric_loader_min_version': fabricLoaderMinVersion, 'java_version': javaVersion,
			'midnightlib_min_version': midnightLibMinVersion

	filesMatching('fabric.mod.json') {
		expand 'version': modVersion, 'minecraft_version': minecraftVersion,
				'fabric_loader_min_version': fabricLoaderMinVersion, 'java_version': javaVersion,
				'midnightlib_min_version': midnightLibMinVersion
	}

	filesMatching('travellers-handbook.mixins.json') {
		expand 'java_version': javaVersion
	}

	exclude 'META-INF/neoforge.mods.toml'
}

tasks.withType(JavaCompile).configureEach {
	options.release = targetJavaVersion
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	from('LICENSE.md') {
		rename { "${it}_travellers-handbook" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
